<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
<style>
body{
    margin:0;
    font-family:sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}
.box{
    background:rgba(255,255,255,0.05);
    padding:30px;
    border-radius:15px;
    width:300px;
    text-align:center;
}
input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}
button{
    width:100%;
    padding:10px;
    background:#00c853;
    border:none;
    border-radius:8px;
    color:white;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
    <h2>🔥 Admin Login</h2>

    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">

    <button onclick="login()">Login</button>
</div>

<script>
function login(){
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;

    // simple auth (later DB se connect karenge)
    if(u==="admin" && p==="1234"){
        localStorage.setItem("admin","true");
        location.href="admin.html";
    } else {
        alert("Invalid Login");
    }
}
</script>

</body>
</html>
