<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel - MyMoney</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 15px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      padding: 8px 12px;
      border: none;
      background: #22c55e;
      color: white;
      cursor: pointer;
      border-radius: 6px;
      margin: 5px;
    }

    .danger {
      background: red;
    }

    input {
      padding: 8px;
      border-radius: 5px;
      border: none;
      margin: 5px;
    }

    .container {
      padding: 20px;
    }

    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      width: 200px;
      text-align: center;
    }

    ul {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      list-style: none;
    }

    li {
      padding: 10px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>

<header>
  <h2>🔥 Admin Dashboard</h2>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- STATS -->
  <div class="cards">
    <div class="card">
      <h3>Users</h3>
      <h2 id="usersCount">0</h2>
    </div>

    <div class="card">
      <h3>Transactions</h3>
      <h2 id="txCount">0</h2>
    </div>

    <div class="card">
      <h3>Total Amount</h3>
      <h2 id="totalAmount">₹0</h2>
    </div>
  </div>

  <br>

  <!-- FILTER -->
  <input type="text" id="search" placeholder="Search...">
  <input type="date" id="dateFilter">
  <button onclick="loadTransactions()">Apply</button>

  <br><br>

  <!-- CHART -->
  <canvas id="chart" height="100"></canvas>

  <br>

  <!-- ACTIONS -->
  <button onclick="loadUsers()">Load Users</button>
  <button onclick="loadTransactions()">Load Transactions</button>
  <button class="danger" onclick="deleteAll()">Delete All History</button>
  <button onclick="exportCSV()">Export CSV</button>

  <br><br>

  <!-- DATA -->
  <ul id="data"></ul>

</div>

<script>
  const TOKEN = localStorage.getItem("token");

if (!TOKEN) {
  alert("Login first!");
  location.href = "admin-login.html";
}
  
const API = "https://my-money-backend-dq7n.onrender.com";


let chart;
let allTx = [];

// USERS
async function loadUsers() {
  const res = await fetch(API + "/admin/users", {
    headers: { authorization: TOKEN }
  });

  const users = await res.json();
  usersCount.innerText = users.length;

  data.innerHTML = "";
  users.forEach(u => {
    data.innerHTML += `
<li>
  👤 ${u.email}
  <button onclick="deleteUser('${u._id}')">❌ Delete</button>
</li>`;
  });
}

// TRANSACTIONS
async function loadTransactions() {
  const res = await fetch(API + "/admin/transactions", {
    headers: { authorization: TOKEN }
  });

  let tx = await res.json();
  allTx = tx;

  // FILTER
  const search = document.getElementById("search").value.toLowerCase();
  const date = document.getElementById("dateFilter").value;

  if (search) {
    tx = tx.filter(t =>
      t.category.toLowerCase().includes(search)
    );
  }

  if (date) {
    tx = tx.filter(t =>
      t.date && t.date.startsWith(date)
    );
  }

  txCount.innerText = tx.length;

  let total = 0, income = 0, expense = 0;
  data.innerHTML = "";

  tx.forEach(t => {
    total += t.amount;

    if (t.type === "income") income += t.amount;
    else expense += t.amount;

    data.innerHTML += `
      <li>
        💰 ${t.type} ₹${t.amount} - ${t.category}
        <button onclick="deleteTx('${t._id}')" class="danger">X</button>
      </li>`;
  });

  totalAmount.innerText = "₹" + total;
  drawChart(income, expense);
}

// DELETE SINGLE
async function deleteTx(id) {
  await fetch(API + "/admin/delete/" + id, {
    method: "DELETE",
    headers: { authorization: TOKEN }
  });
  loadTransactions();
}

// DELETE ALL
async function deleteAll() {
  if (!confirm("⚠️ Delete ALL data?")) return;

  await fetch(API + "/admin/delete-all", {
    method: "DELETE",
    headers: { authorization: TOKEN }
  });

  alert("All history deleted!");
  loadTransactions();
}

// CSV EXPORT
function exportCSV() {
  let csv = "Type,Amount,Category\n";

  allTx.forEach(t => {
    csv += `${t.type},${t.amount},${t.category}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "transactions.csv";
  a.click();
}

// CHART
function drawChart(income, expense) {
  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"), {
    type: "doughnut",
    data: {
      labels: ["Income", "Expense"],
      datasets: [{
        data: [income, expense],
        backgroundColor: ["#22c55e", "#ef4444"]
      }]
    }
  });
}

// LOGOUT
function logout() {
  localStorage.removeItem("token");
  location.href = "admin-login.html";
}
  window.onload = () => {
  loadUsers();
  loadTransactions();
};


  document.getElementById("search").addEventListener("input", loadTransactions);

  async function deleteUser(id) {
  if (!confirm("Delete this user?")) return;

  await fetch(API + "/admin/delete-user/" + id, {
    method: "DELETE",
    headers: {
      authorization: TOKEN
    }
  });

  alert("User deleted");
  loadUsers();
  }

</script>

</body>
</html>
