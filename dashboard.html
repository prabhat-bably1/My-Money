<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Dashboard 💰</h1>

  <!-- SUMMARY -->
  <div class="grid">
    <div class="card">
      <h3>Total Income</h3>
      <p id="income">₹0</p>
    </div>

    <div class="card red">
      <h3>Total Expense</h3>
      <p id="expense">₹0</p>
    </div>

    <div class="card yellow">
      <h3>Tax + CA</h3>
      <p id="tax">₹0</p>
    </div>
  </div>

  <!-- ADD DATA -->
  <div class="card">
    <input id="amount" placeholder="Amount">

    <select id="type">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>

    <input id="category" placeholder="Category (salary / food / rent)">
    <input id="note" placeholder="Note (extra info)">
    <input type="date" id="date">

    <button class="btn" onclick="addData()">Add</button>
  </div>

  <!-- LIST -->
  <div class="card">
    <ul id="list"></ul>
  </div>

  <!-- ACTIONS -->
  <div class="card">
    <button class="btn" onclick="logout()">Logout</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
