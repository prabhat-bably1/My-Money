<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>💰 Dashboard</h1>

  <!-- SUMMARY -->
  <div class="grid">

    <div class="card">
      <h3>Total Income</h3>
      <p id="income">₹0</p>
    </div>

    <div class="card red">
      <h3>Total Expense</h3>
      <p id="expense">₹0</p>
    </div>

    <div class="card yellow" onclick="showTaxDetails()">
      <h3>Tax + CA (Click)</h3>
      <p id="tax">₹0</p>
    </div>

  </div>

  <!-- TAX DETAILS -->
  <div class="card" id="taxDetails" style="display:none;">
    <h3>Tax Details</h3>
    <p id="taxIncome"></p>
    <p id="taxAmount"></p>
    <p id="caCharge"></p>
    <p id="taxAdvice" style="color:green;"></p>
  </div>

  <!-- ADD DATA -->
  <div class="card">
    <h3>Add Entry</h3>

    <input id="amount" placeholder="Amount">
    
    <select id="type">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>

    <input id="category" placeholder="Category">
    <input id="note" placeholder="Note">
    <input type="date" id="date">

    <button onclick="addData()">Add</button>
  </div>

  <!-- LIST -->
  <div class="card">
    <h3>History</h3>
    <ul id="list"></ul>
  </div>

  <!-- ACTIONS -->
  <div class="card">
    <button onclick="downloadPDF()">Download</button>
    <button onclick="logout()">Logout</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
