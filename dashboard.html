<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:linear-gradient(135deg,#0f2027,#2c5364);color:white}
h1{text-align:center}

.top{display:flex;gap:10px;padding:10px}
.card{flex:1;padding:15px;border-radius:15px;text-align:center;cursor:pointer}
.green{background:#00c853}
.red{background:#d50000}
.yellow{background:#ffab00}

input,select,button{width:100%;padding:10px;margin:5px 0;border:none;border-radius:10px}
button{background:#00c853;color:white}

.container{padding:10px}
ul{max-height:150px;overflow:auto}
canvas{background:white;border-radius:10px}
</style>
</head>

<body>

<h1>💰 MyMoney Pro</h1>
<h2 style="text-align:center">Balance: <span id="balance">₹0</span></h2>

<div class="top">
  <div class="card green" onclick="filterData('income')">
    Income <p id="income">₹0</p>
  </div>
  <div class="card red" onclick="filterData('expense')">
    Expense <p id="expense">₹0</p>
  </div>
  <div class="card yellow" onclick="showTaxDetails()">
    Tax <p id="tax">₹0</p>
  </div>
</div>

<div class="container">

<input id="amount" placeholder="Amount">
<select id="type">
  <option value="income">Income</option>
  <option value="expense">Expense</option>
</select>
<input id="category" placeholder="Category">
<input id="note" placeholder="Note">
<input id="date" type="date">

<button onclick="addData()">Add</button>

<h3>History</h3>
<ul id="list"></ul>

<div id="taxDetails" style="display:none">
<p id="taxIncome"></p>
<p id="taxAmount"></p>
<p id="caCharge"></p>
<p id="taxAdvice"></p>
</div>

<canvas id="chart"></canvas>

<button onclick="logout()">Logout</button>

</div>

<script src="dashboard.js"></script>

  <!-- TAX DETAILS PANEL -->
<div id="taxDetails" style="display:none; padding:15px; margin:15px; background:rgba(255,255,255,0.1); border-radius:12px;">
  <h3>📊 Tax Details</h3>

  <p id="taxIncome"></p>
  <p id="taxExpense"></p>
  <p id="taxBalance"></p>
  <p id="taxAmount"></p>
  <p id="caCharge"></p>

  <p id="taxAdvice" style="margin-top:10px; font-weight:bold;"></p>
</div>

</body>
</html>
