<!DOCTYPE html>
<html>
<head>
  <title>MoneyFlow</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="manifest" href="manifest.json">
</head>

<body>

<!-- LOGIN -->
<div id="auth" class="center">
  <div class="card">
    <h2>💰 MoneyFlow</h2>

    <input id="lEmail" placeholder="Email">
    <input id="lPass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>

    <p>or</p>

    <input id="sEmail" placeholder="Email">
    <input id="sPass" type="password" placeholder="Password">
    <button onclick="signup()">Signup</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app" style="display:none;">

  <header>
    <h2>📊 Dashboard</h2>
    <button onclick="logout()">Logout</button>
    <button id="installBtn" style="display:none;">Install App</button>
  </header>

  <div class="container">

    <!-- BALANCE -->
    <div class="card big">
      <h3>Total Balance</h3>
      <h1>₹ <span id="balance">0</span></h1>
    </div>

    <!-- ADD TRANSACTION -->
    <div class="card">
      <h3>Add Transaction</h3>

      <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>

      <input id="amount" placeholder="Amount">
      <input id="category" placeholder="Category (Food, Travel)">
      <input id="note" placeholder="Note (optional)">

      <button onclick="add()">Add</button>
    </div>

    <!-- LIST -->
    <div class="card">
      <h3>Transactions</h3>
      <ul id="list"></ul>
      <canvas id="chart"></canvas>
    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
