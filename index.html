<!DOCTYPE html>
<html>
<head>
  <title>My Money 💸</title>
</head>
<body style="font-family:sans-serif; text-align:center;">

<h2>My Money App 💰</h2>

<!-- AUTH -->
<div id="auth">
  <h3>Signup</h3>
  <input id="sEmail" placeholder="Email"><br><br>
  <input id="sPass" placeholder="Password"><br><br>
  <button onclick="signup()">Signup</button>

  <h3>Login</h3>
  <input id="lEmail" placeholder="Email"><br><br>
  <input id="lPass" placeholder="Password"><br><br>
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <h3 id="balance">Balance: ₹0</h3>

  <select id="type">
    <option value="income">Income</option>
    <option value="expense">Expense</option>
  </select><br><br>

  <input id="amount" placeholder="Amount"><br><br>
  <input id="category" placeholder="Category"><br><br>
  <input id="note" placeholder="Note"><br><br>

  <button onclick="add()">Add</button>
  <button onclick="logout()">Logout</button>

  <ul id="list"></ul>
</div>

<script>
const API = "https://my-money-backend-dq7n.onrender.com";
let token = localStorage.getItem("token") || "";

// SHOW APP
function showApp(){
  document.getElementById("auth").style.display="none";
  document.getElementById("app").style.display="block";
}

// SIGNUP
async function signup(){
  const res = await fetch(API+"/signup",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      email: sEmail.value,
      password: sPass.value
    })
  });

  const data = await res.json();
  alert(data.message || data.error);
}

// LOGIN
async function login(){
  const res = await fetch(API+"/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      email: lEmail.value,
      password: lPass.value
    })
  });

  const data = await res.json();

  if(data.token){
    token = data.token;
    localStorage.setItem("token", token);
    showApp();
    loadData();
  }else{
    alert(data.error);
  }
}

// LOAD DATA
async function loadData(){
  const res = await fetch(API+"/transactions",{
    headers:{authorization:token}
  });

  const data = await res.json();

  let total = 0;
  list.innerHTML="";

  data.forEach(t=>{
    if(t.type==="income") total += t.amount;
    else total -= t.amount;

    list.innerHTML += `<li>₹${t.amount} - ${t.category}</li>`;
  });

  balance.innerText = "Balance: ₹"+total;
}

// ADD
async function add(){
  await fetch(API+"/add",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      authorization:token
    },
    body: JSON.stringify({
      type:type.value,
      amount:Number(amount.value),
      category:category.value,
      note:note.value
    })
  });

  loadData();
}

// LOGOUT
function logout(){
  localStorage.removeItem("token");
  location.reload();
}

// AUTO LOGIN
if(token){
  showApp();
  loadData();
}
</script>

</body>
</html>
