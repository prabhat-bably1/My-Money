<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Money - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#0f172a,#1e293b,#0ea5e9,#22c55e);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.login-container{
    width:90%;
    max-width:380px;
}

.login-box{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:20px;
    padding:35px;
    color:white;
    box-shadow:0 8px 32px rgba(0,0,0,.25);
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    text-align:center;
    font-size:36px;
    margin-bottom:10px;
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:700;
}

.subtitle{
    text-align:center;
    font-size:13px;
    opacity:.8;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:15px;
}

.input-group input{
    width:100%;
    padding:13px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,.15);
    color:white;
}

.input-group input::placeholder{
    color:#ddd;
}

.show-password{
    margin-top:6px;
    font-size:13px;
    cursor:pointer;
    display:inline-block;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:13px;
}

.options a{
    color:white;
    text-decoration:none;
}

.options a:hover{
    text-decoration:underline;
}

.login-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    transform:translateY(-2px);
    background:#16a34a;
}

.signup-link{
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

.signup-link a{
    color:#22c55e;
    font-weight:600;
    text-decoration:none;
}

.signup-link a:hover{
    text-decoration:underline;
}
</style>
</head>
<body>

<div class="login-container">

<div class="login-box">

<div class="logo">💰</div>

<div class="title">My Money</div>

<div class="subtitle">
Manage Your Finance Smartly
</div>

<form>

<div class="input-group">
<input type="text" placeholder="Username or Email" required>
</div>

<div class="input-group">
<input type="password" id="password" placeholder="Password" required>
<span class="show-password" onclick="togglePassword()">
👁 Show Password
</span>
</div>

<div class="options">
<label>
<input type="checkbox">
Remember Me
</label>

<a href="#">Forgot Password?</a>
</div>

<button type="submit" class="login-btn">
LOGIN NOW
</button>

<div class="signup-link">
Don't have an account?
<a href="signup.html">Sign Up</a>
</div>

</form>

</div>

</div>

<script>
function togglePassword(){
    let pass = document.getElementById("password");

    if(pass.type === "password"){
        pass.type = "text";
    }else{
        pass.type = "password";
    }
}
</script>

</body>
</html>
